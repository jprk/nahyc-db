# Vzor konfigurace Apache pro produkci (doc/NASAZENI.md, odstavec 3.4): vložit do virtuálního
# hostitele HTTPS serveru nahyc.fel.zcu.cz. Vychází z /etc/apache2/sites-available/003-nahyc-ssl.conf
# vývojového stroje; cesty a uživatel podle odstavce 3 (/srv/h2db, účet h2db).
# Vyžaduje balík libapache2-mod-wsgi-py3 sestavený pro stejnou verzi Pythonu jako .venv.

WSGIDaemonProcess nahyc-h2db user=h2db group=h2db processes=2 threads=15 \
    python-home=/srv/h2db/repo/.venv python-path=/srv/h2db/repo
WSGIScriptAlias /h2db /srv/h2db/repo/wsgi.py process-group=nahyc-h2db application-group=%{GLOBAL}

<Directory /srv/h2db/repo>
    <Files wsgi.py>
        Require all granted
    </Files>
</Directory>
