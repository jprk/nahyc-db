# Vzor konfigurace Apache pro produkci (doc/NASAZENI.md, odstavec 3.4): vložit do virtuálního
# hostitele HTTPS serveru nahyc.fel.zcu.cz. Vychází z /etc/apache2/sites-available/003-nahyc-ssl.conf
# vývojového stroje; cesty a uživatel podle odstavce 3 (/home/prikryl/DEVEL/nahyc-h2db, účet prikryl).
# Vyžaduje balík libapache2-mod-wsgi-py3 sestavený pro stejnou verzi Pythonu jako .venv.

WSGIDaemonProcess nahyc-h2db user=prikryl group=prikryl processes=2 threads=15 \
    python-home=/home/prikryl/DEVEL/nahyc-h2db/.venv python-path=/home/prikryl/DEVEL/nahyc-h2db
WSGIScriptAlias /h2db /home/prikryl/DEVEL/nahyc-h2db/wsgi.py process-group=nahyc-h2db application-group=%{GLOBAL}

<Directory /home/prikryl/DEVEL/nahyc-h2db>
    <Files wsgi.py>
        Require all granted
    </Files>
</Directory>
